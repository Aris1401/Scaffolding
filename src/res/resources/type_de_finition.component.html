<h1>Gestion des type_de_finitions</h1>

<button (click)="onCreate()" class="btn btn-primary" >Ajout de type_de_finition</button>

<table class="table table-responsive">
  <thead>
    <tr>

      <th>TfDesignation</th>
      <th>TfAugmentationPrix</th>

      <td></td>
      <td></td>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let type_de_finition of type_de_finitions">

      <td>{{ type_de_finition.tfDesignation }}</td>
      <td>{{ type_de_finition.tfAugmentationPrix }}</td>

      <td>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" (click)="onEdit(type_de_finition)">Modifier</button>
            <button class="btn btn-danger" (click)="onDelete(type_de_finition)">Supprimer</button>
        </div>
      </td>
    </tr>
  </tbody>
</table>

<nav aria-label="Page navigation example" class="d-flex gap-2 align-items-center justify-content-end">
  <p>Total of elements: {{ totalOfElements }}</p>

  <ul class="pagination justify-content-end">
    <li class="page-item">
      <a class="page-link" [class.disabled]="isFirstPage" (click)="previousPage()" tabindex="-1" href="javascript:void(0);">Previous</a>
    </li>
    <li class="page-item" *ngFor="let i of generateRange()" ><a class="page-link" [class.active]="i == currentPage" (click)="switchPage(i + 1)" href="javascript:void(0);">{{ i + 1 }}</a></li>
    <li class="page-item">
      <a class="page-link" [class.disabled]="isLastPage" (click)="nextPage()" href="javascript:void(0);">Next</a>
    </li>
  </ul>
</nav>

<div [class.show-modal]="isCreateModalOpen" class="modal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
              <h2>Ajouter type_de_finition</h2>
              <button class="btn btn-close" (click)="onCloseCreateModal()"></button>
            </div>

            <form (submit)="onSubmitCreate()">
            <div class="modal-body">

                  <label for="tfDesignation">TfDesignation:</label>
                  <input class="form-control" type="text" id="tfDesignation" name="tfDesignation" [(ngModel)]="newType_de_finition.tfDesignation" required>
                  <label for="tfAugmentationPrix">TfAugmentationPrix:</label>
                  <input class="form-control" type="number" id="tfAugmentationPrix" name="tfAugmentationPrix" [(ngModel)]="newType_de_finition.tfAugmentationPrix" required>

            </div>

            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">Ajouter</button>
            </div>
            </form>
          </div>
    </div>
</div>

<div [class.show-modal]="isEditModalOpen" class="modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
              <h2>Modifier type_de_finition</h2>
              <button (click)="onCloseEditModal()" class="btn btn-close" ></button>
            </div>

            <form class="d-flex gap-2 flex-column" (submit)="onSubmitEdit()">
                <div class="modal-body">

                  <label for="tfDesignation">TfDesignation:</label>
                  <input class="form-control" type="text" id="tfDesignation" name="tfDesignation" [(ngModel)]="editedType_de_finition.tfDesignation" required>
                  <label for="tfAugmentationPrix">TfAugmentationPrix:</label>
                  <input class="form-control" type="number" id="tfAugmentationPrix" name="tfAugmentationPrix" [(ngModel)]="editedType_de_finition.tfAugmentationPrix" required>

                </div>

                <div class="form-footer">
                    <button class="btn btn-primary" type="submit">Modifier</button>
                </div>
            </form>
          </div>
    </div>
</div>
